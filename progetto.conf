# progetto.conf — i metadati di npz, in un posto solo.
#
# È la fonte di verità per la versione, la descrizione, il manutentore e le
# dipendenze. Chi rilascia tocca **questo file e nient'altro**.
#
# ── perché sta nella radice del progetto ─────────────────────────────────────
#
# Perché le implementazioni sono due — `npz_go/` e `npz_python/` — e la versione
# del progetto è una. Finché questo file stava dentro `npz_go/`, il Python non
# poteva leggerlo senza risalire fuori dal proprio albero, e infatti non lo
# leggeva: si teneva un `VERSIONE = "0.1.0"` scritto a mano in due moduli, che
# ha fatto esattamente quel che fa una copia — è rimasto a 0.1.0 mentre il Go
# arrivava a 0.2.2. Un file nella radice non appartiene a nessuna delle due, ed
# è la sola posizione da cui entrambe lo possono nominare senza salire.
#
# Il formato è `chiave=valore` di shell, e non è una scelta di comodo: tre dei
# quattro consumatori — build/build.sh, build/bin/pacchetto.sh e
# build/bin/PKGBUILD — sono bash, quindi lo leggono con un `.` e senza una riga
# di parsing. Un JSON o uno YAML avrebbero richiesto un attrezzo in più a
# ciascuno, per poi dire le stesse quattordici righe. Il quarto consumatore è il
# Python, e gli costa dieci righe di lettura — vedi sotto.
#
# ── come lo leggono i due gemelli ────────────────────────────────────────────
#
# Il codice Go non lo legge: riceve la versione a tempo di compilazione, da
# `build.sh`, via `-ldflags -X`. Un binario costruito senza passare di lì dice
# "sviluppo" al posto di un numero — ed è voluto, perché è l'unico modo di
# distinguere a occhio un binario di rilascio da uno costruito al volo.
#
# Il Python non ha un tempo di collegamento in cui farsi marchiare, quindi lo
# legge a runtime — ma **pigramente**, alla prima volta che qualcuno chiede
# `VERSIONE`, che è sempre sul percorso lento. Sul percorso veloce, quello che
# sta davanti a ogni comando npm, questo file non viene aperto: aprirlo sarebbe
# una syscall per ogni `npm run` in un loop, pagata per un numero che a quel
# comando non serve. E se non lo trova dice "sviluppo", come il Go.

# ── identità ─────────────────────────────────────────────────────────────────

NOME=npz
VERSIONE=0.2.4

# Il numero di revisione del *pacchetto*, non del programma: si incrementa
# quando cambia l'impacchettamento e il codice no. È il `pkgrel` di Arch.
RILASCIO=1

MANUTENTORE="giancarlo ghigi <giancarlo.ghigi@gmail.com>"
URL="https://github.com/sepoina"

# Il testo integrale sta in `LICENSE`, nella radice. Questa riga e quel file
# devono dire la stessa cosa: è il campo `license` di Arch e Debian, e una
# dichiarazione che non corrisponde al testo spedito è peggio di nessuna.
LICENZA="Apache-2.0"

# ── come si racconta ─────────────────────────────────────────────────────────

# Una riga sola, e corta: è il campo `Description:` di Debian e il `pkgdesc` di
# Arch, e in entrambi i casi finisce in un elenco dove ogni riga è una riga.
DESCRIZIONE_BREVE="node_modules without the node_modules"

# Solo Debian ha una descrizione lunga; Arch non ce l'ha. Le righe vuote qui
# dentro si scrivono vuote: è `pacchetto.sh` a tradurle nel punto solo che il
# formato Debian richiede.
DESCRIZIONE_LUNGA="npz wraps npm: every command passes through unchanged.
It adds one thing — node_modules is compacted into a single compressed
EROFS image, mounted in its place. The toolchain keeps seeing the tree;
backup, indexing and du stop paying for tens of thousands of inodes.

Everything is reversible: \`npz detach\` gives back a plain folder."

# ── dipendenze ───────────────────────────────────────────────────────────────
#
# Sono tre liste e non una, perché i tre mondi impacchettano diversamente lo
# stesso software. Su Arch, **verificato con `pacman -Qo` su questa macchina**,
# `erofsfuse` è un pacchetto a sé; su Debian e su Fedora non si sa, e le liste
# sono quindi volutamente più corte — vedi il commento in pacchetto.sh.

# Verificate: `pacman -Qo $(command -v mkfs.erofs erofsfuse fuse-overlayfs fusermount3)`
DIP_ARCH="erofs-utils erofsfuse fuse-overlayfs fuse3"

# NON verificate contro un repo Debian: erofsfuse è omesso di proposito.
DIP_DEBIAN="erofs-utils, fuse-overlayfs, fuse3"

# NON verificate contro un repo Fedora o openSUSE. Stessa scelta per difetto
# del Debian, e per la stessa ragione: un `Requires` sbagliato non lascia
# installare il pacchetto, mentre un binario mancante npz lo segnala al primo
# uso nominandolo. Separata dalla lista Debian perché è separata la ripartizione
# — non perché oggi i nomi differiscano.
DIP_RPM="erofs-utils fuse-overlayfs fuse3"

# npm non è obbligatorio per quanto npz senza npm non serva a niente: su questa
# macchina npm non appartiene ad alcun pacchetto di sistema, perché installato
# via nvm/fnm/volta. Metterlo fra le obbligatorie escluderebbe proprio il
# pubblico di npz.
OPZIONALI_ARCH=('npm: the package manager npz wraps'
                'nodejs: needed by npm')

# Le stesse, per rpm. Il formato di Arch — `nome: a cosa serve` — qui non esiste:
# rpm non ha un campo per il perché, solo il nome. Diventano `Suggests:` e non
# `Recommends:`, che è la differenza che conta: dnf installa le raccomandate per
# difetto, e installerebbe quindi l'npm della distro proprio a chi ha già il suo.
OPZIONALI_RPM="npm nodejs"
